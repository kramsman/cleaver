[project]
name = "cleaver-root"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bekgoogle",
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pymsgbox>=2.0.1",
    "uvbekutils",
]

[project.scripts]
cleaver = "cleaver.rovcleaver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleaver"]

[tool.uv.sources]
uvbekutils = { git = "https://github.com/kramsman/uvbekutils.git" }
bekgoogle = { git = "https://github.com/kramsman/bekgoogle.git" }
